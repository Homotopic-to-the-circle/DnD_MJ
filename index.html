<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe2c2">
<!-- Thème commun Dal-Mor (jour / nuit) : https://github.com/Homotopic-to-the-circle/dalmor-ui -->
<script src="/dalmor-ui/theme.js"></script>
<link rel="stylesheet" href="/dalmor-ui/theme.css">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MJ Dal-Mor">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{height:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="icon" type="image/png" sizes="192x192" href="mj-192.png">
<link rel="apple-touch-icon" href="mj-180.png">
<title>MJ · Feuille de Perso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout : une colonne mobile sur parchemin, en-tête collant (nom, états, onglets), titres en petites capitales rouges soulignés d'un filet effilé comme dans les blocs de stats */
/* Couleurs : thème commun Dal-Mor (dalmor-ui/theme.css), jour par défaut, nuit au choix (depuis le d20 du Portail).
   Le bloc :root ci-dessous n'est qu'un SECOURS si dalmor-ui ne charge pas : ne pas y modifier les couleurs,
   les changer dans dalmor-ui. Aucune couleur en dur ailleurs : toujours var(--…). */
:root{
  --bg:#efe2c2;--card:#f6ecd4;--fg:#2a1c12;--muted:#6e5a44;--line:#cdb68c;
  --accent:#7a1c12;--accent-soft:#ecd3b8;--on-accent:#fbf4e4;--danger:#7a1c12;--danger-soft:#ecd3b8;
  --conc:#3f5226;--conc-soft:#dfe3c4;--warn:#6a4a10;--warn-soft:#f1dfae;
  --disp:"IM Fell English SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html{background:var(--bg)}
body{color:var(--fg);font:17px/1.4 var(--body);background:var(--bg)}
*{box-sizing:border-box}
.wrap{overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
main{display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;color:var(--accent)}
h1{font-size:1.6rem;line-height:1.1}
/* filet rouge plein sous chaque titre */
h2{font-size:1.25rem;letter-spacing:.02em;padding-bottom:4px;border:none;
   border-bottom:2px solid var(--accent)}
/* titre avec un bouton à droite (Repos long) */
.h2b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h2b button{font-family:var(--body);font-size:.95rem;letter-spacing:0;height:30px;padding:0 10px;display:inline-flex;align-items:center;line-height:1;margin-bottom:4px}
.bandeau{display:flex;flex-direction:row;gap:12px;align-items:center;justify-content:space-between}.bandeau-id{min-width:0;flex:1}.bandeau .repos{display:flex;flex-direction:column;gap:6px;flex:none}.bandeau .repos button{height:32px;min-height:0;padding:0 12px;font-size:.92rem;white-space:nowrap}.gestion~section h2{font-size:1.05rem;border-bottom-width:1px}.bandeau{line-height:1.35}.bandeau b{font-size:1.05rem}
.gestion-t{display:flex;justify-content:space-between;align-items:baseline;width:100%;height:auto;min-height:0;padding:0 0 4px;border:none;border-bottom:2px solid var(--accent);border-radius:0;background:transparent;font-family:var(--disp);font-size:1.25rem;letter-spacing:.02em;color:var(--accent);text-align:left;cursor:pointer}
.err-t{color:var(--danger)}
/* notes par ligne, sorts non préparés, avantage aux sauvegardes */
.note-l{display:block;font-size:.88rem;font-style:italic;color:var(--muted)}
ul.plain li>span{display:block}
.note-in{width:100%;font-size:.85rem!important;color:var(--muted)}
.capa-ed .note-in{grid-column:1/-1}
.n-ed{flex-direction:column;align-items:stretch!important;gap:4px}
.non-prep{opacity:.45}
.ajout-sort{display:flex;flex-direction:column;gap:6px}
.ajout-sort .sort-inf{flex-wrap:nowrap}.ajout-sort .sort-inf input{flex:1;min-width:0}
.ajout-bas{flex-wrap:nowrap;align-items:center;gap:12px}.ajout-bas button{margin-left:auto}
.case-s{display:flex;align-items:center;gap:7px;font-size:.92rem;cursor:pointer;position:relative}
.case-s input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.losange{flex:none;width:11px;height:11px;border:2px solid var(--accent);transform:rotate(45deg);margin:0 2px}
.case-s input:checked+.losange{background:var(--accent)}
.sort-ed .box.prep{flex:none;margin:0 10px 0 4px}
.car .s{position:relative}
.js{position:relative}
.av{position:absolute;left:100%;margin-left:5px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);font-style:italic}
.av-btn{position:absolute;left:100%;margin-left:4px;top:50%;transform:translateY(-50%);height:22px!important;padding:0 5px!important;font-size:.72rem!important;line-height:1}
/* harmonisation : petite étoile rouge à côté du nom */
.harmo{display:inline-block;margin-left:6px;color:var(--accent);font-size:1rem;line-height:1}
/* visionneuse de documents (images, PDF) : fenêtre de l'app, comme les règles */
.vd-fen{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--fg) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:14px}
.vd-carte{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:100%;max-width:900px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(var(--ombre),.35)}
.vd-carte.plein{max-width:none;width:100%!important;height:100%!important;border-radius:0}.vd-fen:has(.plein){padding:0}
.vd-barre{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}.vd-barre b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--disp);color:var(--accent);font-size:1.05rem}
.vd-pg{font-size:.85rem;white-space:nowrap}.vd-b{flex:none;width:34px;height:34px;padding:0;line-height:1;font-size:1.05rem}
.vd-scene{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--bg);cursor:grab}.vd-tr{position:absolute;left:0;top:0;transform-origin:0 0}
.vd-tr img{display:block;max-width:none}.vd-page{position:absolute;background:var(--card);box-shadow:0 1px 6px rgba(var(--ombre),.3)}
.vd-msg{position:absolute;inset:auto 0 auto 0;top:40%;text-align:center;padding:0 20px}
.vd-ext{align-self:center;font-size:.8rem;color:var(--muted);padding:4px 0 6px}
/* règles intégrées (capacités absentes d'AideDD) : fenêtre façon page, fermée par ✕, le fond ou « retour » */
.regle-fen{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--fg) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:14px}
.regle-fen>div{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:100%;max-width:600px;max-height:88vh;overflow:auto;box-shadow:0 10px 30px rgba(var(--ombre),.35)}
.regle-barre{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.regle-barre b{font-size:1.1em}.regle-barre button{flex:none}
.regle-corps{padding:10px 14px 16px}.regle-corps p{margin:.5em 0}.regle-corps .muted{font-size:.9em}
/* pas de rectangle bleu de Chrome Android sur le lien touché (il restait visible sous la fenêtre qui s'ouvre) */
a{-webkit-tap-highlight-color:transparent}
.regle-corps table{border-collapse:collapse;margin:.5em 0}.regle-corps td,.regle-corps th{border:1px solid var(--line);padding:2px 6px}
.code-row{flex-wrap:nowrap}.code-row>*{box-sizing:border-box;height:38px}.code-row input{flex:1;min-width:0}.code-row button{padding:0 14px}
/* pas de filet sous le dernier élément d'une liste */
ul.plain li:last-child,.res>:nth-last-child(-n+2),.skill:nth-last-child(-n+2),
.arme:not(:has(~ .arme)),.arme-ed:not(:has(~ .arme-ed)),.slot:not(:has(~ .slot)),.sort:not(:has(~ .sort)),
.sort-ed:not(:has(~ .sort-ed)),.objet:not(:has(~ .objet)),.obj-ed:not(:has(~ .obj-ed)){border-bottom:none}
section{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:.92rem;font-style:italic}
button{font:inherit;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:4px;padding:8px 12px;cursor:pointer}
button.pri,button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.dgr{color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
a{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;box-shadow:var(--card-sh,0 1px 0 rgba(255,255,255,.6) inset,0 1px 3px rgba(80,50,20,.12))}
.texte{white-space:pre-wrap;overflow-wrap:anywhere}
.lab{font-family:var(--disp);font-size:.85rem;letter-spacing:.04em;color:var(--muted)}
/* en-tête */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));margin-top:-12px;padding-top:16px!important;display:flex;flex-direction:column;gap:6px;padding-top:4px;padding-bottom:0}
.top>.row{flex-wrap:nowrap}
.top .titre{flex:1;min-width:0}
.top .titre h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .titre .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{padding:5px 9px;font-size:.92rem}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--accent)}
.tabs button{flex:1;padding:6px 2px 4px;font-family:var(--disp);font-size:1rem;border:none;border-radius:3px 3px 0 0;white-space:nowrap;min-width:0;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
/* boutons de l'en-tête (‹, États, crayon) : hauteur fixe identique ; le crayon est un carré de cette hauteur */
.top>.row>button{height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
.top>.row>button.icone{width:36px;padding:0}
.top button.icone svg{display:block;width:18px;height:18px}
/* mode Modifier : champs et boutons d'une même hauteur, pour des lignes alignées */
main.ed input{box-sizing:border-box;height:32px;padding:0 8px;font-size:.95rem}
main.ed .lien-in,main.ed .lien-ed input{font-size:.8rem}
main.ed button{box-sizing:border-box;height:32px;padding:0 10px;font-size:.95rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
main.ed .x{width:32px;padding:0}
main.ed .box{height:18px;padding:0}
main.ed .pvval input{height:auto;padding:0;font-size:2.1rem}
main.ed .pvcard .pv button{height:34px;padding:0;font-size:1.2rem}
main.ed .cpt button{width:34px;height:34px;padding:0;font-size:1.2rem}
/* états actifs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:.92rem;padding:2px 10px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.chip.conc{border-color:var(--conc);background:var(--conc);color:var(--on-accent)}
.etats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.etats button{padding:7px 6px;font-size:1rem}
.etats button.on{background:var(--accent);color:var(--on-accent)}
/* PV */
.pv{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.pv button{font-size:1.6rem;padding:4px 0;line-height:1.2}
.pvval{display:flex;align-items:baseline;justify-content:center;gap:6px;font-variant-numeric:tabular-nums lining-nums}
.pvval input{width:4.5ch;font-size:2.4rem;font-weight:700;text-align:center;padding:0;border:none;background:transparent;border-bottom:1px solid var(--accent);border-radius:0;color:var(--accent)}
.pvval span{font-size:1.3rem;color:var(--muted)}
.pvcard{display:grid;grid-template-columns:1.35fr 1fr;gap:10px 14px;padding:10px 12px}
.pvcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.pvcol+.pvcol{border-left:1px solid var(--line);padding-left:12px}
.pvcard .pv{grid-template-columns:30px 1fr 30px;gap:4px}
.pvcard .pv button{font-size:1.2rem;padding:0;height:34px}
.pvcard .pvval input{width:3ch;font-size:2.1rem}
.pvcard .pvval span{font-size:1.15rem}
.pvcol .pv{margin-top:auto}
.mort{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.mort-g{display:grid;grid-template-columns:auto auto;gap:2px 10px;align-items:center;justify-items:end}
.mort .boxes{gap:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;padding:6px 2px;min-width:0}
.pvmax-in{width:3.2ch;font-size:inherit!important;padding:0!important;height:auto!important;border:none;border-bottom:1px solid var(--accent);border-radius:0;background:transparent;text-align:center;color:var(--muted)}
.sugg{position:fixed;z-index:60;max-height:280px;overflow:auto;background:var(--card);border:1px solid var(--accent);border-radius:4px;box-shadow:0 4px 14px rgba(var(--ombre,42,28,18),.3);display:flex;flex-direction:column}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 10px;font:inherit;font-size:1rem;color:var(--fg);height:auto;width:100%;flex:none}
.sugg button:last-child{border-bottom:none}
.sugg-i{font-size:.8rem;color:var(--muted);font-style:italic;white-space:nowrap}
.arme-mt{grid-column:1/-1;justify-self:start;border:none;background:transparent;padding:2px 0;height:auto;color:var(--fg)}
.losange.on{background:var(--accent)}
.vers-att{grid-column:1/-1;justify-self:start;height:28px;padding:0 10px;font-size:.88rem}
.js-in{width:3.2ch;font-size:inherit!important;padding:0!important;height:auto!important;border:none;border-bottom:1px solid var(--accent);border-radius:0;background:transparent;text-align:center}
.stat-in{text-align:center;font-weight:700;font-size:1.2rem!important;padding:0!important;height:30px!important;margin:0 auto 2px;display:block;width:90%}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.stat .lab{font-size:.72rem;letter-spacing:.01em}
/* cases : losanges, comme les emplacements des fiches officielles */
.boxes{display:grid;gap:4px 8px;justify-content:end;padding:2px}
.slot .boxes{justify-content:end}
.cpt{display:flex;align-items:center;gap:10px;justify-content:end}
.cpt button{width:34px;height:34px;padding:0;font-size:1.2rem;line-height:1}
.cpt b{font-size:1.3rem;min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums lining-nums}
.cpt b span{font-size:.95rem;font-weight:400;color:var(--muted)}
.box{width:18px;height:18px;padding:0;border:2px solid var(--accent);border-radius:2px;background:transparent;transform:rotate(45deg);margin:3px}
.box.on{background:var(--accent)}
.box.e{border-color:var(--fg)}.box.e.on{background:var(--fg)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.res .n{min-width:0}
/* filet fin entre les ressources, comme pour l'équipement */
.res{gap:0}.res>.n{padding-right:10px}
.res>*{align-self:stretch;border-bottom:1px solid var(--line);padding:5px 0;min-height:40px;box-sizing:border-box}
.res>.n{display:flex;align-items:center}.res>.boxes{align-content:center}.res>.cpt,.res>.res-ed{align-items:center}
.x{border:none;background:transparent;color:var(--accent);padding:4px 8px}
/* armes */
.armes{display:flex;flex-direction:column}
.arme{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.arme .nom{font-weight:700;font-size:1.08rem}
.arme .att{font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums lining-nums;color:var(--accent);text-align:right}
.arme .deg{grid-column:1/-1}
.jrn-j{border-bottom:1px solid var(--line)}.jrn-j:last-child{border-bottom:none}
.jrn-j-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;height:auto;min-height:38px;padding:6px 0;border:none;background:transparent;text-align:left;font:inherit;color:var(--fg);font-weight:700}
.jrn-j-t .muted{font-weight:normal;font-style:italic;font-size:.88rem;white-space:nowrap}
.jrn-j-c{padding:0 0 8px}.jrn-j-c p{margin:4px 0}.jrn-j-c ul{margin:4px 0;padding-left:20px}
.pnj-j{padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}.pnj-j:first-child{border-top:none}.pnj-j-n .muted{font-style:italic;font-size:.88rem}.pnj-j-n{display:block;width:100%;height:auto;min-height:0;padding:0;border:none;background:transparent;text-align:left;font:inherit;color:var(--fg);cursor:pointer}.pnj-j.replie{padding:4px 0}.pnj-j-p{margin:2px 0}
.pnj-g-t{display:flex;justify-content:space-between;align-items:baseline;width:100%;height:auto;min-height:0;padding:6px 0 2px;border:none;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-variant:small-caps;letter-spacing:.04em;color:var(--accent);cursor:pointer;text-align:left}.pnj-g+.pnj-g{margin-top:6px}.pnj-g-t+.pnj-j{border-top:none}
.pnj-j-c{padding-left:12px;position:relative}.pnj-j-c::before{content:'–';position:absolute;left:0;color:var(--muted)}.pnj-j-c.ok{text-decoration:line-through;color:var(--muted)}
.arme .mains{float:right;margin-left:8px;padding:2px 10px;font-size:.85rem}
.arme-ed{display:grid;grid-template-columns:1fr 4.2rem auto;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.arme-ed .full{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.arme-ed input{padding:4px 6px}
/* caracs */
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.car{text-align:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;padding:6px}
.car .lab{color:var(--accent)}
.car .m{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums lining-nums;line-height:1.1}
.car .v{color:var(--muted);font-size:.9rem}
.car .s{font-size:.85rem;margin-top:2px}
.dot{display:inline-block;width:.55em;height:.55em;border:1.5px solid var(--accent);margin-right:7px;vertical-align:.08em;transform:rotate(45deg)}
.dot.on{background:var(--accent)}
/* expertise : un losange dans le losange */
.dot.exp{background:var(--accent);box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--accent)}
/* le losange tourné déborde d'environ 3 px : on le décale pour qu'il s'aligne sur le début des filets */
.skill .dot{margin-left:3px}
.dot-btn{padding:0!important;height:.55em!important;width:.55em;min-width:0;border-radius:0;background:transparent;cursor:pointer}.dot-btn.on{background:var(--accent)}
.dot-btn{position:relative}.dot-btn::after{content:'';position:absolute;inset:-9px}  /* zone de toucher plus large que le losange */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.skill{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);font-size:1rem;min-width:0}
.skill b{font-variant-numeric:tabular-nums lining-nums}
/* toutes les listes suivent la convention de l'équipement : une ligne par élément, filet fin dessous */
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.plain li{padding:5px 0;border-bottom:1px solid var(--line);min-height:40px;display:flex;align-items:center}
/* sorts */

<div id="app" class="wrap"></div>
<script>
/* App MJ : joueurs et leurs codes, catalogue d'objets, envois aux joueurs.
   Tout passe par des fonctions Supabase protégées par le code MJ (gardé sur cet appareil uniquement). */
const SUPA='https://mgcofajllvellwcudjxx.supabase.co',CLE_PUB='sb_publishable_WLlUZ1Aznum4Rz1qwab53Q_xisC28pj';
const KEY='dnd55.mj';
/* Version = date de mise en ligne du fichier (en-tête Last-Modified de GitHub Pages, gardé par le cache hors ligne), à l'heure de l'appareil */
const VERSION=(()=>{const d=new Date(document.lastModified);if(isNaN(d)||Math.abs(Date.now()-d)<5000)return '24.11.2026';
  const z=n=>String(n).padStart(2,'0');return `${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()} à ${z(d.getHours())}:${z(d.getMinutes())}`})();
const TYPES=[['objet','Objet'],['arme','Arme'],['armure','Armure'],['magique','Objet magique'],['potion','Potion'],['parchemin','Parchemin'],['lettre','Lettre'],['carte','Carte'],['autre','Autre']];
const ONGLETS=[['rencontres','Rencontres'],['objets','Objets'],['envois','Envois'],['archives','Journal'],['campagne','Campagne']];
const ONGLETS_TEL=[ONGLETS[0],['pnj','PNJ'],['lieux','Lieux'],...ONGLETS.slice(1)];
const ONGLETS_ORDI=[['pnj','PNJ'],['objets','Objets'],['envois','Envois']];
const ongl=()=>grand()?ONGLETS_ORDI:ONGLETS_TEL;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseInt(v,10);return isNaN(n)?0:n};
const jolieCle=c=>String(c||'').replace(/(.{4})(?=.)/g,'$1-');

let ui={onglet:'rencontres',edit:false,envoi:null,choix:{},ajout:false,init:false,confRetirer:null,confSortir:false};
try{const o=localStorage.getItem(KEY+'.onglet');if(o)ui.onglet=o==='joueurs'?'campagne':o}catch(e){}
if(!ONGLETS_TEL.some(o=>o[0]===ui.onglet))ui.onglet='rencontres';
let etat=null,flash=null,charge=false,nouveauCode=null,anim='';

async function rpc(fn,args){
  const r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CLE_PUB,'Content-Type':'application/json'},body:JSON.stringify(args)});

}
const MSG={code_mj_invalide:'Code MJ refusé.',init_invalide:'Code d’initialisation refusé (ou déjà utilisé).',code_trop_court:'Le code MJ doit faire au moins 8 caractères.',nom_manquant:'Indique un nom.',objet_inconnu:'Objet introuvable.'};
function erreur(e){return e&&e.serveur?(MSG[e.message]||'Erreur du serveur : '+e.message):'Pas de connexion. Réessaie.'}

  try{etat=await rpc('mj_etat',{p_code:code});charge=true;await chargerRenc();if(!archCharge)await chargerArch();if(!pnjCharge)await chargerPnj();if(!lieuxCharge)await chargerLieux();if(!jrnCharge)await chargerJournal()}
  catch(e){if(e.serveur&&e.message==='code_mj_invalide'){code='';try{localStorage.removeItem(KEY+'.code')}catch(_){}}if(!silence)flash={err:1,t:erreur(e)}}

}
async function action(fn,args,msg){
  try{const r=await rpc(fn,Object.assign({p_code:code},args));if(msg)flash={t:typeof msg==='function'?msg(r):msg};await charger(true);return r}
  catch(e){flash={err:1,t:erreur(e)};render();return null}

/* messages courts : bandeau flottant en bas de l'écran, effacé après 4 s (6 s pour une erreur) ou au toucher */

/* ---------- rendu ---------- */
/* ordinateur tactile (Linux/KDE + Firefox) : le clavier virtuel « chiffres » s'ouvre puis se referme aussitôt.
   Hors téléphone/tablette, on garde le clavier normal (il a aussi les chiffres). */
const MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function clavierOrdi(){if(!MOBILE)document.querySelectorAll('[inputmode="numeric"]').forEach(i=>i.removeAttribute('inputmode'))}
function render(){
  rendu();renderDock();if(refChamp&&!document.body.contains(refChamp))refFermer();
}
function rendu(){
  const app=document.getElementById('app');
  if(!code){app.innerHTML=vueConnexion();return}
  if(!charge){app.innerHTML=`<h1>MJ</h1><p class="muted">Chargement…</p>`;return}
  const g=grand(),ong=g&&!ONGLETS_ORDI.some(o=>o[0]===ui.onglet)?'pnj':ui.onglet;
  const tabs=ongl().map(([k,l])=>`<button data-a="onglet" data-o="${k}" aria-current="${ong===k}">${l}</button>`).join('');
  const corps={objets:ongObjets,envois:ongEnvois,rencontres:ongRencontres,archives:()=>ui.lecture&&lect&&lect.id===ui.lecture?ongArchives():'<h2 style="margin-bottom:-6px">Journal</h2>'+ongJournal()+ongArchives(),campagne:ongCampagne,pnj:ongPnj,lieux:ongLieux}[ong]||ongRencontres;
  const defil=c=>c.querySelector(':scope>.defile')||c;
  const hauts=[...document.querySelectorAll('.mj-bureau>*')].map(c=>defil(c).scrollTop),gauches=[...document.querySelectorAll('.mj-bureau>*')].map(c=>defil(c).scrollLeft);
  const pageX=scrollX,pageY=scrollY;
  app.innerHTML=`<header class="top"><div class="row"><div class="titre"><h1>${esc(etat.campagne.nom)}</h1></div>
    <button data-a="edit" class="icone ${ui.edit?'on':''}" aria-pressed="${ui.edit}" aria-label="${ui.edit?'Terminer':'Modifier'}">${ui.edit
      ?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
      :'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>'}</button></div>
    ${g?'':`<nav class="tabs">${tabs}</nav>`}</header>${g?`<div class="mj-bureau"><main><nav class="tabs">${tabs}</nav><div class="defile">${corps()}</div></main><aside class="pnj-col" aria-label="${({rencontres:'Rencontres',lieux:'Lieux',journal:'Journal'})[col2()]}">${col2Html()}</aside><aside class="table-j" aria-label="Joueurs à la table">${tableJ()}</aside></div>`:`<main class="${anim}">${corps()}</main>`}`;

  clavierOrdi();

/* ordinateur : la table des joueurs (PV, états, or) reste visible à droite, mise à jour en direct */
const GRAND=window.matchMedia?matchMedia('(min-width: 1000px)'):{matches:false};

const absentJ=id=>{const e=etat&&(etat.joueurs||[]).find(x=>x.id===id);return !!(e&&e.absent)};

  const js=(etat&&etat.joueurs)||[],tri=[...js.filter(j=>!j.absent),...js.filter(j=>j.absent)];
  const carte=e=>{const j=live.find(x=>x.id===e.id)||{},o=orJ(e),ouv=ui.jOuv===e.id,id=esc(e.id);

        ?`<button class="dgr btn-s" data-a="retirerJOui" data-id="${id}">Retirer ?</button>`:`<button class="x" data-a="retirerJ" data-id="${id}" aria-label="Retirer ${esc(e.nom)}">✕</button>`}</div></div></div>`;

    <div class="row code-row"><input id="jnom" placeholder="Nouveau joueur"><button data-a="ajoutJ">Ajouter</button></div>

      <span class="muted">Version du ${esc(VERSION)}</span></div>`;
}
/* ---------- Sac et bourse d'un joueur (vus depuis sa fiche synchronisée) ----------
   Objet venu du catalogue : on le modifie dans le catalogue (suit en direct chez tous ceux qui l'ont).
   Objet du joueur : correction envoyée à son app (nom, quantité, description ; 0 = retiré). Pièces : ajout / retrait en po. */

    plein.x+=m1.x-m0.x;plein.y+=m1.y-m0.y;zoomer(d(ap)/Math.max(1,d(av)),m1.x-s.left,m1.y-s.top)}});

/* tout l'argent du joueur converti en pièces d'or : 1 pp = 10 po, 1 pe = ½ po, 1 pa = 1/10 po, 1 pc = 1/100 po */
function orJ(j){const p=j.pieces;if(!p)return null;
  const t=num(p.pc)/100+num(p.pa)/10+num(p.pe)/2+num(p.po)+num(p.pp)*10;
  return (Math.round(t*100)/100).toLocaleString('fr-CH',{maximumFractionDigits:2})}

async function televerserFichier(f,ancien){
  const h={apikey:CLE_PUB,'Content-Type':f.type||'application/octet-stream','x-mj-code':encodeURIComponent(code),'x-nom':encodeURIComponent(f.name)};
  if(ancien)h['x-remplace']=encodeURIComponent(ancien);
  const r=await fetch(SUPA+'/functions/v1/televerser',{method:'POST',headers:h,body:f});
  const t=await r.json().catch(()=>({}));if(!r.ok)throw new Error(t.message||'erreur');return t;
}
async function joindreArch(input){
  const f0=input.files&&input.files[0],id=input.dataset.arch;if(!f0||input._pris)return;input._pris=true;
  let a=id==='nouveau'?null:arch.find(x=>x.id===id);if(id!=='nouveau'&&!a)return;
  const titre=id==='nouveau'?(ui.archTitre||((document.getElementById('atitre')||{}).value)||'').trim()||f0.name.replace(/\.[^.]+$/,''):'';
  ui.archEnvoi=id;render();
  try{
    const f=await compresser(f0);if(f.size>15*1048576)throw new Error('trop_lourd');
    const t=await televerserFichier(f,a&&a.url);
    const maj={url:t.url,type:f.type,taille:t.taille,nomFichier:f.name,maj:new Date().toISOString()};
    if(a)Object.assign(a,maj);else{a=Object.assign({id:Math.random().toString(36).slice(2,10),titre,note:''},maj);arch.unshift(a);ui.archTitre='';try{localStorage.removeItem(KEY+'.archTitre')}catch(e){}}

  }catch(e){const m=String(e.message||e);flash={err:1,t:m==='trop_lourd'?'Fichier trop lourd (15 Mo maximum).':m==='type_refuse'?'Seuls les images et les PDF sont acceptés.':m==='code_mj_invalide'?'Code MJ refusé.':'Envoi du fichier impossible ('+m+').'}}
  ui.archEnvoi=null;render();
}

/* ---------- rencontres ----------
   Un seul document par campagne (sections, monstres, PV, initiatives), gardé aussi sur l'appareil :
   chaque modification est écrite tout de suite ici, puis envoyée au serveur ; si l'envoi échoue, il est retenté. */
const RK=KEY+'.renc';
const ETATS=['À terre','Agrippé','Assourdi','Aveuglé','Charmé','Effrayé','Empoisonné','Entravé','Étourdi','Inconscient','Invisible','Neutralisé','Paralysé','Pétrifié'];
let renc=[],live=[],rencCharge=false,rver=0,rTimer=null,rErr=false;
const rid=()=>Math.random().toString(36).slice(2,10);
function rLocal(){try{return JSON.parse(localStorage.getItem(RK)||'null')}catch(e){return null}}
function rEcrire(sale){try{localStorage.setItem(RK,JSON.stringify({doc:renc,sale}))}catch(e){}}
/* documents d'avant : combat {init,…} → init gardée sur la rencontre */
function rMigrer(d){(d||[]).forEach(s=>{s.monstres=s.monstres||[];if(s.combat&&typeof s.combat==='object'){s.init=Object.assign({},s.combat.init,s.init);s.combat=true}s.init=s.init||{};s.combat=!!s.combat;
  s.monstres.forEach(m=>{m.etats=m.etats||{};m.note=m.note||''})});return d}
async function chargerRenc(){
  try{const r=await rpc('mj_rencontres',{p_code:code});live=r.joueurs||[];
    if(!rencCharge){const loc=rLocal();
      if(loc&&loc.sale&&Array.isArray(loc.doc)){renc=rMigrer(loc.doc);rPlanifier(0)}else{renc=rMigrer(Array.isArray(r.rencontres)?r.rencontres:[]);rEcrire(false)}
      rencCharge=true}}
  catch(e){if(!rencCharge){const loc=rLocal();if(loc&&Array.isArray(loc.doc)){renc=rMigrer(loc.doc);rencCharge=true}}}
}
function rModifie(){rver++;rEcrire(true);rPlanifier(800)}
function rPlanifier(ms){clearTimeout(rTimer);rTimer=setTimeout(rEnvoyer,ms)}
async function rEnvoyer(){
  if(!rencCharge)return;const v=rver;
  try{await rpc('mj_rencontres_sauver',{p_code:code,p_doc:renc});if(v===rver)rEcrire(false);rErr=false}
  catch(e){if(!rErr){rErr=true;flash={err:1,t:'Rencontres pas encore enregistrées en ligne (gardées sur cet appareil, nouvel essai automatique).'};renderDock()}rPlanifier(10000)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&rTimer&&(rLocal()||{}).sale){clearTimeout(rTimer);rEnvoyer()}});
const sec=id=>renc.find(x=>x.id===id);
/* « https://www.aidedd.org/monster/fr/chef-gobelin » ou « Chef gobelin » → nom + lien */
function lireMonstre(t){
  t=t.trim();const m=t.match(/aidedd\.org\/monster\/(?:fr\/)?([^/?#\s]+)/i);
  if(m){const n=decodeURIComponent(m[1]).replace(/-/g,' ');return{nom:n.charAt(0).toUpperCase()+n.slice(1),url:t.startsWith('http')?t:'https://'+t}}
  const slug=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’]/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return{nom:t,url:slug?'https://www.aidedd.org/monster/fr/'+slug:''};
}
const vide=v=>String(v??'').trim()==='';

/* ordre d'initiative : du plus grand au plus petit, joueurs d'abord à égalité ; sans initiative en dernier, grisés */
function ordre(s,avecJoueurs){
  const l=[...(avecJoueurs?live.filter(j=>j.pv!=null&&!absentJ(j.id)).map(j=>({k:'j:'+j.id,j})):[]),...s.monstres.map(m=>({k:'m:'+m.id,m}))]
    .map(x=>Object.assign(x,{v:vide(s.init[x.k])?null:num(s.init[x.k])}));
  const avec=l.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v||(a.j?-1:0)-(b.j?-1:0));
  return [...avec,...l.filter(x=>x.v==null)];
}

function refLev(a,b){if(a===b)return 0;let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
/* chaque mot tapé doit se retrouver dans le nom : début de mot (le mieux), morceau de mot, ou à une ou deux fautes près */
function refChercher(cle,q,max){
  const t=refN(q);if(t.length<2)return[];const mots=t.split(' ');
  const r=[];
  for(const it of refListe(cle)){
    const ws=it.n.split(' ');let s=it.n.startsWith(t)?-2:it.n===t?-3:0,ok=true;
    for(const m of mots){
      let b=9;
      for(const w of ws){
        if(w.startsWith(m)){b=0;break}
        if(m.length>=3&&w.includes(m))b=Math.min(b,1);
        else if(m.length>=4){const tol=m.length>=7?2:1,d=Math.min(refLev(m,w.slice(0,m.length)),refLev(m,w));if(d<=tol)b=Math.min(b,2+d)}
      }
      if(b===9){ok=false;break}s+=b;
    }
    if(ok)r.push([s,it]);
  }
  return r.sort((a,b)=>a[0]-b[0]||a[1].n.length-b[1].n.length||a[1].n.localeCompare(b[1].n)).slice(0,max||8).map(x=>x[1]);
}
/* liste déroulante sous le champ (data-ref="monstres|sorts|armes|objets") ; refChoisi(champ, élément) est défini par chaque app */
let refBox=null,refChamp=null,refRes=[];
function refFermer(){if(refBox)refBox.remove();refBox=null;refChamp=null;refRes=[]}
function refOuvrir(champ){
  refRes=refChercher(champ.dataset.ref,champ.value,40);refChamp=champ;
  if(!refRes.length){if(refBox)refBox.remove();refBox=null;return}
  if(!refBox){refBox=document.createElement('div');refBox.className='sugg';refBox.setAttribute('role','listbox');document.body.appendChild(refBox)}
  refBox.innerHTML=refRes.map((it,i)=>`<button type="button" data-sugg="${i}" role="option"><span>${esc(it.aff)}</span>${it.info?`<span class="sugg-i">${esc(it.info)}</span>`:''}</button>`).join('');
  refPlacer();
}
function refPlacer(){
  if(!refBox||!refChamp)return;if(!document.body.contains(refChamp)){refFermer();return}
  const r=refChamp.getBoundingClientRect(),w=Math.max(r.width,Math.min(300,innerWidth-16)),l=Math.max(8,Math.min(r.left,innerWidth-w-8));
  refBox.style.left=l+'px';refBox.style.width=w+'px';
  const vv=window.visualViewport,vb=vv?vv.offsetTop+vv.height:innerHeight;
  refBox.style.maxHeight=Math.max(120,Math.min(280,Math.max(vb-r.bottom,r.top)-12))+'px';
  const bas=vb-r.bottom,h=Math.min(refBox.scrollHeight,280);
  if(bas<h+8&&r.top>bas){refBox.style.top='';refBox.style.bottom=(innerHeight-r.top+4)+'px'}else{refBox.style.bottom='';refBox.style.top=(r.bottom+4)+'px'}
}
document.addEventListener('input',ev=>{const c=ev.target;if(c.dataset&&c.dataset.ref){delete c.dataset.choisi;refOuvrir(c)}},true);
document.addEventListener('focusin',ev=>{const c=ev.target;if(c.dataset&&c.dataset.ref&&c.value&&!c.dataset.choisi)refOuvrir(c)});
document.addEventListener('focusout',ev=>{if(ev.target===refChamp)setTimeout(()=>{if(document.activeElement!==refChamp)refFermer()},200)});
/* toucher une suggestion ne doit pas faire perdre le champ avant le choix */
document.addEventListener('pointerdown',ev=>{if(ev.target.closest&&ev.target.closest('.sugg'))ev.preventDefault()},true);
document.addEventListener('mousedown',ev=>{if(ev.target.closest&&ev.target.closest('.sugg'))ev.preventDefault()},true);
document.addEventListener('click',ev=>{
  const b=ev.target.closest&&ev.target.closest('[data-sugg]');if(!b)return;ev.stopPropagation();
  const it=refRes[+b.dataset.sugg],c=refChamp;refFermer();if(!it||!c)return;
  c.value=it.nom.replace(/\|/g,' / ');c.dataset.choisi=c.value;c.dataset.url=it.url;
  refChoisi(c,it);
},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')refFermer()});
document.addEventListener('scroll',()=>refPlacer(),{passive:true,capture:true});
window.addEventListener('resize',()=>refPlacer());
if(window.visualViewport){visualViewport.addEventListener('resize',()=>refPlacer());visualViewport.addEventListener('scroll',()=>refPlacer())}



render();if(code)charger();chargerRef();chargerTextes();
/* cache hors ligne, seulement sur le vrai site */
if(location.hostname.endsWith('github.io')&&'serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
